name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK cmdline-tools
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          # Build against a current platform/build-tools, then smoke-test behavior
          # on minSdk API 24 via emulator.
          sdkmanager --install \
            "platform-tools" \
            "build-tools;36.0.0" \
            "platforms;android-36" \
            "emulator" \
            "system-images;android-24;default;x86_64"

      - name: Run host JVM unit tests
        run: ./run-tests.sh

      - name: Build debug APK
        run: ./build-debug.sh

      - name: Emulator smoke test (hardware ESC -> 0x1b)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 24
          arch: x86_64
          target: default
          profile: Nexus 6
          disable-animations: true
          script: ./run-emulator-smoke-test.sh build/app-debug.apk
